name: Build Signed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.POKKE_KEYSTORE_BASE64 }}" | base64 -d > pokke-release.keystore
        # If you prefer to commit the keystore (not recommended for public repos),
        # you can skip this step and keep the file in the repo.

      - name: Build Release APK
        env:
          POKKE_STORE_PASSWORD: ${{ secrets.POKKE_STORE_PASSWORD }}
          POKKE_KEY_PASSWORD: ${{ secrets.POKKE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokke-release
          path: app/build/outputs/apk/release/*.apk
