name: Build Signed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.POKKE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.POKKE_KEYSTORE_BASE64 }}" | base64 -d > pokke-release.keystore
            echo "Keystore decoded from secret"
          elif [ -f pokke-release.keystore ]; then
            echo "Using keystore already in the repository"
          else
            echo "ERROR: No keystore found"
            exit 1
          fi
          ls -la pokke-release.keystore
          file pokke-release.keystore || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          POKKE_STORE_PASSWORD: ${{ secrets.POKKE_STORE_PASSWORD || 'pokke2026secure' }}
          POKKE_KEY_PASSWORD: ${{ secrets.POKKE_KEY_PASSWORD || 'pokke2026secure' }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokke-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
